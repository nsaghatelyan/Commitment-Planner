[project]
name = "savings-backend"
version = "0.1.0"
description = "API, workers, collectors and recommendation engine for the savings tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "duckdb>=1.1",
    "pytz>=2024.1",  # duckdb needs it to return timestamptz values to Python
    "pyarrow>=17",
    "boto3>=1.35",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[s3,sts,organizations]>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the docker-compose Postgres (skipped when unreachable)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
